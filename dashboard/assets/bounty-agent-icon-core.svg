    <path d="M48 21v54M26 34l22 13 22-13M26 62l22-15 22 15" fill="none" stroke="#83f7ff" stroke-opacity=".42" stroke-width="1.5"/>
    <rect x="34" y="34" width="28" height="28" rx="7" fill="url(#core)" opacity=".95"/>
    <rect x="37.5" y="37.5" width="21" height="21" rx="4.5" fill="#06131d" opacity=".84"/>
    <path d="M41.5 31v6M48 31v6M54.5 31v6M41.5 59v6M48 59v6M54.5 59v6M31 41.5h6M31 48h6M31 54.5h6M59 41.5h6M59 48h6M59 54.5h6" fill="none" stroke="#b7ff35" stroke-opacity=".78" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M48 40v16M40 48h16M42.5 42.5l11 11M53.5 42.5l-11 11" fill="none" stroke="#031018" stroke-width="5.2" stroke-linecap="round"/>
